<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A collection of studies from the In Progress shelf.">
  <title>Collection — In Progress</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script defer src="data.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <header class="collection-bar">
    <a class="wordmark" href="index.html">In Progress</a>
    <div class="collection-tools">
      <a href="category.html?view=all">All ideas</a>
      <a href="category.html?view=upload">Upload idea</a>
      <button class="sound" type="button" aria-pressed="true">Sound on</button>
      <a href="index.html">Back to shelf</a>
    </div>
  </header>
  <main class="collection">
    <header class="collection-intro">
      <h1 id="collection-name">Collection</h1>
      <p id="collection-description"></p>
      <a id="next-collection" hidden></a>
      <nav id="category-index" aria-label="Browse collections" hidden></nav>
    </header>
    <div class="gallery" id="gallery"></div>
    <p id="notice" role="status"></p>
    <section id="detail" hidden>
      <a id="back-collection">Back to collection</a>
      <p id="credits"></p>
      <p id="tags"></p>
      <div id="plates"></div>
    </section>
    <form id="idea-form" hidden>
      <label class="drop-area">
        <span class="upload-mark" aria-hidden="true">↑</span>
        <strong>Drop your images here</strong>
        <span class="choose-button">Choose images</span>
        <input type="file" aria-label="Choose images" name="files" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" multiple>
      </label>
      <div id="previews"></div>
      <label>Title<input name="title" placeholder="From your image name" maxlength="140"></label>
      <label>Description<textarea name="description" placeholder="A note, if you like" rows="2" maxlength="2000"></textarea></label>
      <label>Category<select name="category" required></select></label>
      <details class="optional-fields"><summary>Credit &amp; tags</summary>
        <label>Author<input name="author" placeholder="Anonymous" maxlength="80"></label>
        <label>Tags<input name="tags" placeholder="Light, colour, texture" maxlength="250"></label>
      </details>
      <p role="status" id="form-message"></p>
      <button type="submit">Publish idea</button>
    </form>
    <aside id="inspiration" hidden>
      <h2>Inspiration</h2>
      <div class="moodboard"></div>
    </aside>
    <noscript>Enable JavaScript to view this collection.</noscript>
  </main>
  <template id="publication">
    <article class="publication">
      <a class="post-link">
        <img loading="lazy" decoding="async" alt="">
        <h2></h2>
        <p></p>
      </a>
    </article>
  </template>
</body>
</html>
