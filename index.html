<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse a shelf of unfinished ideas, visual experiments and creative references.">
  <title>In Progress — The shelf</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script defer src="data.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <main class="home">
    <div class="shelf-bar">
      <nav class="idea-links" aria-label="Publications"><a href="category.html?view=all">All ideas</a><a href="category.html?view=upload">Upload idea</a></nav>
      <button class="sound" type="button" aria-pressed="true">Sound on</button>
    </div>
    <header class="intro">
      <div>
      <h1>In Progress</h1>
      <p>A home for unfinished ideas.</p>
      </div>
      <div class="record-study" aria-hidden="true">
        <div class="disc"><i></i></div>
        <div class="paper-cover"></div>
      </div>
    </header>

    <nav class="record-rack" aria-label="Categories">
      <div class="rack-heading"><h2>Browse the shelf</h2><span id="shelf-count"></span></div>
      <div class="shelf-window" id="shelf-window">
        <ul class="sleeves" id="sleeves"></ul>
      </div>
      <div class="rail" aria-hidden="true"></div>
      <div class="shelf-controls" hidden>
        <button type="button" id="previous" aria-label="Scroll shelf left" aria-controls="shelf-window">←</button>
        <button type="button" id="next" aria-label="Scroll shelf right" aria-controls="shelf-window">→</button>
      </div>
    </nav>
    <section class="recent" aria-labelledby="recent-heading">
      <div class="rack-heading"><h2 id="recent-heading">Recent ideas</h2><a href="category.html?view=all">View all</a></div>
      <div id="recent-ideas"></div>
    </section>
    <noscript>Enable JavaScript to browse the shelf.</noscript>
  </main>
</body>
</html>
